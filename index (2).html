<style>

function nmbNet(url,WSC){
 const AL='abcdefghijklmnopqrstuvwxyz0123456789',myId=Array.from({length:16},()=>AL[Math.random()*36|0]).join('');
 let ws=null,ready=false,tries=0;const rooms=new Map(),pend=[];
 const raw=o=>{try{ws.send(JSON.stringify(o))}catch(e){}};
 const send=o=>{if(ready)raw(o);else pend.push(o)};
 function connect(){try{ws=new WSC(url)}catch(e){return}
  ws.onopen=()=>{ready=true;tries=0;raw({t:'hello',id:myId});rooms.forEach(r=>{raw({t:'join',room:r.name});raw({t:'pres',room:r.name,p:r.state})});pend.splice(0).forEach(raw)};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}const r=rooms.get(m&&m.room);if(!r)return;
   if(m.t==='snap'&&Array.isArray(m.list)){r.peers=new Map();m.list.forEach(q=>{if(q&&q.peer!==myId)r.peers.set(q.peer,q.presence||{})});r.peers.set(myId,r.state);r.fire()}
   else if(m.t==='upd'&&m.peer!==myId){r.peers.set(m.peer,m.presence||{});r.fire()}
   else if(m.t==='gone'){r.peers.delete(m.peer);r.fire()}};
  ws.onclose=()=>{ready=false;setTimeout(connect,Math.min(8000,400*++tries))};ws.onerror=()=>{}}
 function mkRoom(name){const r={name,state:{},peers:new Map(),cbs:new Set(),tm:0,
   list(){return [...r.peers].map(([peer,presence])=>({peer,presence,kind:'viewer',guest:false,by:null,isMe:peer===myId,sameTab:peer===myId}))},
   fire(){const l=r.list();r.cbs.forEach(f=>{try{f({peers:l})}catch(e){}})}};
  r.peers.set(myId,r.state);rooms.set(name,r);send({t:'join',room:name});
  return {name,peers:()=>r.list(),
   presence(patch){Object.assign(r.state,patch);r.peers.set(myId,r.state);if(!r.tm)r.tm=setTimeout(()=>{r.tm=0;send({t:'pres',room:name,p:r.state})},34);return Promise.resolve()},
   onPeers(f){r.cbs.add(f);return()=>r.cbs.delete(f)},emit(){return Promise.resolve()},on(){return()=>{}},
   leave(){send({t:'leave',room:name});rooms.delete(name);return Promise.resolve()}}}
 connect();
 const lobby=mkRoom('lobby');
 return {ns:{...lobby,join:name=>Promise.resolve(mkRoom(String(name)))},id:myId,ready:()=>ready};
}

function scData(){const d={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('brawl-')===0&&!SC_SKIP.includes(k))d[k]=localStorage.getItem(k)}}catch(e){}return d}
async function scApi(path,body,keep){const b=scBase();if(!b)throw new Error('nosrv');const r=await fetch(b+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),keepalive:!!keep});let j={};try{j=await r.json()}catch(e){}if(!r.ok){const e=new Error(j.error||('http '+r.status));e.status=r.status;throw e}return j}
async function scBackup(keep,force){if(SC.busy)return SC.code;SC.busy=1;try{const d=scData(),s=JSON.stringify(d);if(SC.code&&s===SC.last&&!force)return SC.code;const kp=keep&&s.length<60000;let j;
  try{j=await scApi('/api/save',SC.code?{code:SC.code,data:d}:{data:d},kp)}catch(e){if(e.status===404&&SC.code){SC.code='';j=await scApi('/api/save',{data:d},kp)}else throw e}
  SC.code=j.code;SC.last=s;try{localStorage.setItem('brawl-savecode',SC.code)}catch(e){}return SC.code}finally{SC.busy=0}}
async function scRestore(code){const j=await scApi('/api/load',{code});const d=j.data;if(!d||typeof d!=='object')throw new Error('bad');
 const rm=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('brawl-')===0&&!SC_SKIP.includes(k))rm.push(k)}rm.forEach(k=>localStorage.removeItem(k));
 for(const k of Object.keys(d)){if(/^brawl-[a-z0-9_-]{1,40}$/i.test(k)&&!SC_SKIP.includes(k.toLowerCase())&&typeof d[k]==='string')localStorage.setItem(k,d[k])}
 localStorage.setItem('brawl-savecode',code);location.reload()}
function scToast(t){const o=document.createElement('div');o.setAttribute('role','status');o.textContent=t;o.style.cssText='position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:9997;max-width:92vw;background:var(--panel,#1d1531);color:var(--ink,#f0e9ff);border:3px solid var(--box-border,#f0e9ff);border-radius:8px;padding:10px 14px;text-align:center;font:14px "Trebuchet MS",Verdana,sans-serif';document.body.append(o);setTimeout(()=>o.remove(),7000)}
setInterval(()=>{if(SC.code&&scBase())scBackup().catch(()=>{})},60000);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&SC.code&&scBase())scBackup(1).catch(()=>{})});
const _scSA=statAdd;statAdd=function(){const r=_scSA.apply(this,arguments);setTimeout(()=>{if(!SC.code&&scBase())scBackup().then(c=>{if(c)scToast('Your save code is '+c+'. You can always find it under Save code in the main menu.')}).catch(()=>{})},2000);return r};
function openSaveCode(){menu.className='';menu.innerHTML='';menu.style.display='flex';el('h2',menu,'Save code');
 const p=el('p',menu,'Your 4-digit code brings back your coins, items, fighters and progress on any device. Keep it private: anyone who has it can load your save.');p.style.cssText='margin:0;font-size:13px;text-align:center;max-width:48ch';
 const big=el('div',menu,SC.code||'----');big.style.cssText='font:44px Impact,sans-serif;letter-spacing:.25em;padding-left:.25em;text-align:center';big.setAttribute('aria-label',SC.code?'Your save code is '+SC.code.split('').join(' '):'You do not have a save code yet');
 const msg=el('p',menu,'');msg.style.cssText='margin:0;font-size:13px;min-height:1.4em;text-align:center;max-width:48ch';
 let r=el('div',menu);r.className='r';
 const mk=el('button',r,SC.code?'Back up now':'Get my code');
 mk.onclick=async()=>{if(!scBase()){msg.textContent='Save codes need the game server. They are not available on this version of the game.';return}mk.disabled=true;msg.textContent='Saving...';
  try{const c=await scBackup(0,1);big.textContent=c;msg.textContent='Saved. Your code is '+c+'.';mk.textContent='Back up now'}
  catch(e){msg.textContent=e.status===429?'Too many tries. Please wait a while and try again.':e.status===503?'No codes are free right now. Please try again later.':'Could not reach the save server. Try again in a moment.'}mk.disabled=false};
 const cc=el('button',r,'Copy code');cc.onclick=()=>{if(!SC.code){msg.textContent='Get your code first.';return}try{navigator.clipboard.writeText(SC.code).then(()=>{cc.textContent='Copied'}).catch(()=>{cc.textContent=SC.code})}catch(e){cc.textContent=SC.code}};
 const h=el('p',menu,'Got a code from another device?');h.style.cssText='margin:6px 0 0;font-size:13px;text-align:center';
 r=el('div',menu);r.className='r';const inp=el('input',r);inp.placeholder='0000';inp.maxLength=4;inp.inputMode='numeric';inp.setAttribute('aria-label','Save code to restore');inp.style.cssText='width:5.5em;text-align:center;font-size:20px;letter-spacing:.2em';
 let armed='';const rb=el('button',r,'Restore');
 inp.addEventListener('input',()=>{inp.value=inp.value.replace(/\D/g,'').slice(0,4);armed='';rb.textContent='Restore'});
 rb.onclick=async()=>{const c=inp.value;if(!/^\d{4}$/.test(c)){msg.textContent='Type the 4 digits of your code.';return}
  if(!scBase()){msg.textContent='Save codes need the game server. They are not available on this version of the game.';return}
  if(armed!==c){armed=c;rb.textContent='Tap again to confirm';msg.textContent='This replaces the data on this device with the saved data for code '+c+'.';return}
  rb.disabled=true;msg.textContent='Restoring...';
  try{await scRestore(c)}catch(e){armed='';rb.textContent='Restore';rb.disabled=false;msg.textContent=e.status===404?'No save found for that code.':e.status===429?'Too many tries. Please wait an hour and try again.':'Could not reach the save server. Try again in a moment.'}};
 el('button',menu,'Back').onclick=mainMenu}
/* ===== park quick chat: fixed phrases and emotes only ===== */
const QC_P=['Hello!','Good fight!','Rematch?','Nice moves!','Want to fight?',"Let's go!",'Good luck!','Thanks!','Oops!','Wait for me','Follow me','2v2?','3v3?','Join my party?','GG','Be right back'];
const QC_E=['\u{1F44B}','\u{1F600}','\u{1F602}','\u{1F62E}','\u{1F525}','\u{1F44D}','\u{1F44F}','\u2764\uFE0F'];
let NOCHAT_=false;try{NOCHAT_=localStorage.getItem('brawl-nochat')==='1'}catch(e){}
const NOCHAT=()=>NOCHAT_;
park.qcs=new Map();park.chat=0;park.qn=0;park.qc=0;park.qme=null;park.qlast=0;
function qcSend(k,i){const now=Date.now();if(now-park.qlast<1200)return;park.qlast=now;park.qn++;park.qc={n:park.qn,k,i};park.qme={k,i,t:now};park.key='';park.chat=0}
function qcDraw(px,py,k,i,age){x.save();x.globalAlpha=age>3800?Math.max(0,1-(age-3800)/700):1;x.textAlign='center';x.textBaseline='alphabetic';
 if(k==='e'){x.font='30px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';x.fillStyle='#fff';x.fillText(QC_E[i],px,py-76)}
 else{x.font='bold 13px Trebuchet MS,sans-serif';const t=QC_P[i],w=x.measureText(t).width+16,bx=px-w/2,by=py-100;
  x.fillStyle='#fff';x.strokeStyle='#241a3a';x.lineWidth=2;x.beginPath();x.moveTo(bx+6,by);x.lineTo(bx+w-6,by);x.quadraticCurveTo(bx+w,by,bx+w,by+6);x.lineTo(bx+w,by+18);x.quadraticCurveTo(bx+w,by+24,bx+w-6,by+24);
  x.lineTo(px+5,by+24);x.lineTo(px,by+31);x.lineTo(px-5,by+24);x.lineTo(bx+6,by+24);x.quadraticCurveTo(bx,by+24,bx,by+18);x.lineTo(bx,by+6);x.quadraticCurveTo(bx,by,bx+6,by);x.closePath();x.fill();x.stroke();
  x.fillStyle='#241a3a';x.fillText(t,px,by+17)}
 x.restore()}
function parkBubbles(L){const now=Date.now();
 if(park.qme&&now-park.qme.t<4500){const m=L.find(p=>p.me);if(m)qcDraw(m.px,m.py,park.qme.k,park.qme.i,now-park.qme.t)}
 for(const p of L){if(p.me||!p.pr)continue;let s=park.qcs.get(p.pr);const q=p.qc,ok=q&&typeof q==='object'&&Number.isInteger(q.n)&&Number.isInteger(q.i)&&q.i>=0&&(q.k==='p'?q.i<QC_P.length:q.k==='e'?q.i<QC_E.length:false);
  if(!s){s={n:ok?q.n:-1,k:'',i:0,t:0,lt:0};park.qcs.set(p.pr,s)}
  else if(ok&&q.n!==s.n){s.n=q.n;if(now-s.lt>900&&!NOCHAT()){s.k=q.k;s.i=q.i;s.t=now;s.lt=now}}
  if(s.t&&now-s.t<4500&&!NOCHAT())qcDraw(p.px,p.py,s.k,s.i,now-s.t)}}
function chatUI(){if(!park.chat){TQ.hot.push({x:W-86,y:8,w:78,h:26,fn:()=>{park.chat=1}});x.save();x.fillStyle='rgba(10,10,16,.8)';x.fillRect(W-86,8,78,26);x.strokeStyle='#ffd23f';x.lineWidth=2;x.strokeRect(W-86,8,78,26);x.fillStyle='#ffd23f';x.font='bold 13px Trebuchet MS,sans-serif';x.textAlign='center';x.textBaseline='alphabetic';x.fillText('Chat (C)',W-47,26);x.restore();return}
 TQ.hot=[];x.save();x.textBaseline='alphabetic';x.textAlign='center';x.fillStyle='rgba(10,10,16,.94)';x.fillRect(120,34,560,332);x.strokeStyle='#ffd23f';x.lineWidth=3;x.strokeRect(120,34,560,332);
 x.fillStyle='#fff';x.font='18px Impact,sans-serif';x.fillText('QUICK CHAT',W/2,58);
 const btn=(bx,by,bw,bh,t,fn,fs,col)=>{x.fillStyle=col||'#ffd23f';x.fillRect(bx,by,bw,bh);x.strokeStyle='#241a3a';x.lineWidth=2;x.strokeRect(bx,by,bw,bh);x.fillStyle='#241a3a';x.font=(fs||'bold 13px Trebuchet MS,sans-serif');x.textAlign='center';x.fillText(t,bx+bw/2,by+bh/2+5);TQ.hot.push({x:bx,y:by,w:bw,h:bh,fn})};
 btn(606,40,66,22,'Close',()=>{park.chat=0},'bold 12px Trebuchet MS,sans-serif','#ddd');
 btn(128,40,210,22,'Chat from others: '+(NOCHAT_?'OFF':'ON'),()=>{NOCHAT_=!NOCHAT_;try{localStorage.setItem('brawl-nochat',NOCHAT_?'1':'0')}catch(e){}},'bold 12px Trebuchet MS,sans-serif','#ddd');
 QC_P.forEach((t,i)=>btn(132+(i%2)*272,72+Math.floor(i/2)*30,264,26,t,()=>qcSend('p',i)));
 QC_E.forEach((t,i)=>btn(132+i*68,318,60,36,t,()=>qcSend('e',i),'24px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif'));
 x.restore()}
/* ===== friend parties: queue 2v2 / 3v3 together and land on the same team ===== */
const PT={id:'',lead:'',inv:0,qn:0,qt:0,qz:0,seen:new Set(),sq:0,miss:0,mq:0,toast:null};
function ptMembers(){if(!PT.id)return[];const o=[];try{for(const q of lobPeers()){const y=q.presence&&q.presence.pty;if(y&&y.id===PT.id&&typeof q.presence.fid==='string')o.push({fid:q.presence.fid,n:String(q.presence.fn||'').slice(0,10),me:!!q.sameTab,peer:q.peer})}}catch(e){}return o}
function partyMode(){if(!PT.id)return 0;return ptMembers().length<2?0:PT.lead===FRN.id?1:2}
function ptLeave(){PT.id='';PT.lead='';PT.qn=0;PT.inv=0;lobPub()}
function ptInvite(f){if(!frPeer(f.c))return false;if(PT.id&&PT.lead!==FRN.id)return false;if(ptMembers().length>=3)return false;
 if(!PT.id){PT.id=Math.random().toString(36).slice(2,8);PT.lead=FRN.id}
 const id=Math.random().toString(36).slice(2,10);PT.inv={to:f.c,id,p:PT.id,l:PT.lead,n:String(MY[0].name||'').slice(0,10)};lobPub();
 setTimeout(()=>{if(PT.inv&&PT.inv.id===id){PT.inv=0;lobPub()}},30000);return true}
function ptToastClose(){if(PT.toast){PT.toast.remove();PT.toast=null}}
function ptToast(text,okLabel,okFn){ptToastClose();const o=document.createElement('div');PT.toast=o;o.setAttribute('role','alert');
 o.style.cssText='position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:9998;max-width:92vw;background:var(--panel,#1d1531);color:var(--ink,#f0e9ff);border:3px solid var(--box-border,#f0e9ff);border-radius:8px;padding:10px 14px;text-align:center;font:14px "Trebuchet MS",Verdana,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.5)';
 const t=document.createElement('div');t.textContent=text;o.append(t);const r=document.createElement('div');r.style.cssText='display:flex;gap:10px;justify-content:center;margin-top:8px';
 if(okFn){const ok=document.createElement('button');ok.textContent=okLabel||'OK';ok.onclick=()=>{ptToastClose();okFn()};r.append(ok)}
 const no=document.createElement('button');no.textContent=okFn?'Dismiss':'OK';no.onclick=ptToastClose;r.append(no);o.append(r);document.body.append(o);setTimeout(ptToastClose,okFn?25000:6000)}
setInterval(()=>{try{if(!LOB.rm||PT.toast||gameLive()||TEAM.on||net.on)return;for(const q of lobPeers()){const v=q.presence&&q.presence.pi;
 if(q.sameTab||!v||typeof v!=='object'||v.to!==FRN.id||PT.seen.has(v.id))continue;const f=FRN.list.find(z=>z.c===q.presence.fid);if(!f)continue;PT.seen.add(v.id);
 const pid=String(v.p||'').replace(/[^a-z0-9]/g,'').slice(0,12),ld=String(v.l||'');if(!pid||!frOk(ld))continue;
 ptToast((String(v.n||'').slice(0,10)||f.n||'A friend')+' invited you to a party','Join',()=>{frStopQueues();PT.id=pid;PT.lead=ld;PT.qn=0;lobPub()});break}}catch(e){}},1500);
setInterval(()=>{try{if(!PT.id||!LOB.rm)return;const mem=ptMembers();
 if(PT.lead!==FRN.id&&!mem.some(m=>m.fid===PT.lead)){if(++PT.miss>=4){ptLeave();PT.miss=0;ptToast('Your party ended.')}}else PT.miss=0
 if(PT.lead===FRN.id&&PT.qn&&TQ.on&&TQ.pty&&!TQ.go&&mem.length>=1&&mem.length<PT.qz){PT.qz=mem.length;LOB.pz=PT.qz;if(PT.qz<2)LOB.pt=0;lobPub()}}catch(e){}},1000);
setInterval(()=>{try{if(!PT.id||PT.lead===FRN.id||!LOB.rm)return;const lp=lobPeers().find(q=>!q.sameTab&&q.presence&&q.presence.fid===PT.lead&&q.presence.pq),pq=lp&&lp.presence.pq;
 if(pq&&typeof pq==='object'&&(pq.n===2||pq.n===3)&&Number.isFinite(pq.t)){PT.mq=0;
  if(!TQ.on&&!TQ.go&&!TEAM.on&&!TEAM.joining&&!net.on&&!gameLive()&&PT.sq!==pq.t){PT.sq=pq.t;PT.qn=pq.n;PT.qt=pq.t;PT.qz=Math.max(2,Math.min(3,pq.z|0||2));TQ.from=park.on?1:0;
   tqStart(pq.n,{t:pq.t,party:1,z:PT.qz});if(!park.on)openTeamQueue(pq.n,1)}}
 else if(TQ.on&&TQ.pty&&!TQ.go){if(++PT.mq>=4){PT.mq=0;tqStop();TEAM.joining=0;TQ.info='';ptToast('Your party leader stopped the queue.')}}else PT.mq=0}catch(e){}},700);
reset();mainMenu();menu.style.display='none';loop();
{const nb=document.getElementById('nmb-boot');if(nb)nb.remove()}
